    <!-- Іздеу жолағы -->
  <form class="search-bar">
    <input type="text" placeholder="Іздеу..." />
    <button type="submit">🔍</button>
  </form>
  <script>
document.getElementById("search").addEventListener("keyup", function() {
  let filter = this.value.toLowerCase();
  let items = document.querySelectorAll(".content p");

  items.forEach(item => {
    if (item.textContent.toLowerCase().includes(filter)) {
      item.style.display = "block";
    } else {
      item.style.display = "none";
    }
  });
});

  </script>

    <section class="register">
        <h2>Тіркелу</h2>
        <form action="#" method="post">
            <label for="name">Аты-жөніңіз:</label>
            <input type="text" id="name" name="name" placeholder="Аты-жөніңізді енгізіңіз" required>

            <label for="confirm">Құпия сөзді қайталаңыз:</label>
            <input type="password" id="confirm" name="confirm" placeholder="Қайта енгізіңіз" required>
